name: Morning Brief podcast

on:
  push:
    branches: [main]
    paths: ["brief/scripts/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morning-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mutagen==1.47.0 kokoro-onnx==0.6.1 soundfile==0.14.0
      - name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Cache Kokoro model
        uses: actions/cache@v4
        with:
          path: brief/models
          key: kokoro-v1.0
      - name: Download Kokoro model
        run: |
          mkdir -p brief/models && cd brief/models
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -f kokoro-v1.0.onnx ] || curl -fsSL -o kokoro-v1.0.onnx $base/kokoro-v1.0.onnx
          [ -f voices-v1.0.bin ] || curl -fsSL -o voices-v1.0.bin $base/voices-v1.0.bin
      - name: Voice new scripts and rebuild feed
        run: python brief/build.py
      - name: Commit audio and feed
        run: |
          git config user.name "morning-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A brief
          git diff --cached --quiet && exit 0
          git commit -m "Morning Brief: publish episode"
          git push
