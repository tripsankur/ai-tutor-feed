name: Morning Brief podcast

on:
  push:
    branches: [main]
    paths: ["brief/scripts/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morning-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mutagen==1.47.0
      - name: Voice new scripts and rebuild feed
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python brief/build.py
      - name: Commit audio and feed
        run: |
          git config user.name "morning-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A brief
          git diff --cached --quiet && exit 0
          git commit -m "Morning Brief: publish episode"
          git push
